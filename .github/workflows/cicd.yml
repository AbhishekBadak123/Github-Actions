
name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: java-cicd-main
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: BUILD AND SONARQUBE ANALYSIS
  # ==========================================
  build:
    name: Build and Code Analysis
    runs-on: [self-hosted, linux]

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Install Maven if not available
      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            echo "Installing Maven..."
            sudo dnf install -y maven
          fi

          mvn -version

      # 4. Build Java application
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 5. SonarQube Code Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$(echo "$SONAR_HOST" | tr -d '\r\n')" \
            -Dsonar.token="$(echo "$SONAR_TOKEN" | tr -d '\r\n')"

      # 6. Upload WAR artifact
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error
          retention-days: 5


  # ==========================================
  # JOB 2: DEPLOY TO TOMCAT
  # ==========================================
  deploy:
    name: Deploy to Tomcat
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:

      # 1. Download WAR artifact
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: war-artifact

      # 2. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(find war-artifact -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "Deploying $WAR_FILE to Tomcat..."

          curl --fail --show-error --silent \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://$TOMCAT_HOST/manager/text/deploy?path=/myapp&update=true"

          echo "Deployment completed successfully!"

      # 3. Verify deployment
      - name: Verify Tomcat Deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Checking application deployment..."

          curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://$TOMCAT_HOST/myapp/"

          echo "Application is running successfully!"
